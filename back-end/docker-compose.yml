name: la-penultima-lounge

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro

  auth:
    build: .
    command: node --watch services/auth/src/index.js
    environment:
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - ./services/auth/src:/app/services/auth/src
      - ./packages/common/src:/app/packages/common/src
    depends_on:
      - db

  sedes:
    build: .
    command: node --watch services/sedes/src/index.js
    environment:
      PORT: 3002
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - ./services/sedes/src:/app/services/sedes/src
      - ./packages/common/src:/app/packages/common/src
    depends_on:
      - db

  gateway:
    build: .
    command: node --watch gateway/src/index.js
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - ./gateway/src:/app/gateway/src
      - ./packages/common/src:/app/packages/common/src
    depends_on:
      - auth
      - sedes

volumes:
  pgdata: